server:
  port: ${AUTH_PORT:8188}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: model-gateway-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:user_manager}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

new-api:
  user-manager:
    default-password: ${NEW_API_USER_MANAGER_DEFAULT_PASSWORD:.12345678.}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: 7200
  auto-renew: true
  is-read-header: true
  is-read-cookie: false
  is-concurrent: true
  is-share: false
  jwt-secret-key: ignored-by-rsa
  is-log: false

gateway:
  jwt:
    issuer: model-gateway-auth
    audience: apisix-llm-gateway
    expire-seconds: 7200
    private-key-file: ${GATEWAY_JWT_PRIVATE_KEY_FILE:D:\Project\model-gateway-auth\cert\gateway-jwt-private.pem}
    public-key-file: ${GATEWAY_JWT_PUBLIC_KEY_FILE:D:\Project\model-gateway-auth\cert\gateway-jwt-public.pem}
  credential:
    key-id: ${GATEWAY_CREDENTIAL_KEY_ID:main}
    aes-key-file: ${GATEWAY_CREDENTIAL_AES_KEY_FILE:D:\Project\model-gateway-auth\cert\gateway-credential-aes.key}
    gateway-secret-file: ${APISIX_GATEWAY_SECRET_FILE:D:\Project\model-gateway-auth\cert\apisix-gateway-secret.txt}

email:
  qq:
    host: smtp.qq.com
    port: 587
    username: ${EMAIL_QQ_USERNAME:}
    password: ${EMAIL_QQ_PASSWORD:}
    from: ${EMAIL_QQ_FROM:}
  netease:
    host: smtp.163.com
    port: 25
    username: ${EMAIL_163_USERNAME:}
    password: ${EMAIL_163_PASSWORD:}
    from: ${EMAIL_163_FROM:}
  generic:
    host: ${EMAIL_GENERIC_HOST:}
    port: ${EMAIL_GENERIC_PORT:587}
    username: ${EMAIL_GENERIC_USERNAME:}
    password: ${EMAIL_GENERIC_PASSWORD:}
    from: ${EMAIL_GENERIC_FROM:}
